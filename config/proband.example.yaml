hpo_absent: []
# Automated reviews must identify themselves as automated, never as a person.
reviewed_by: REPLACE_WITH_REVIEWER
reviewed_at: YYYY-MM-DD
notes: Replace placeholders after reviewing local extraction. Do not copy free clinical text here.
