# Public template only: all identifiers and review fields below are placeholders.
# Copy into an ignored *.local.yaml file; never commit a patient's configuration.
proband_id: PROBAND01
vcf_sample_id: REPLACE_WITH_VCF_SAMPLE_ID
# Preserve UNKNOWN unless the authorised source establishes this field.
