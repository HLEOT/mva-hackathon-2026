# Storage is decimal bytes; RAM is GiB (2^30 bytes).
limits:
  cpus: 112
  memory_gib: 400
  # User approved this increase on 2026-09-05; the original baseline is unchanged.
  additional_disk_bytes: 400000000000
  # Buffer for in-flight writes while a stage terminates.
  disk_reserve_bytes: 10000000000
supervisor:
  session: mva-hackathon
  heartbeat_seconds: 10
  transient_attempts: 5
  retry_seconds: 30
# Interpretation belongs to the active Codex conversation, not a downloaded
# model, nested agent, API client, or inference server. Workers use review files.
cleanup:
  # Only allowlisted disposable files, between stages while no child is live.
  automatic: true
delivery:
  hf_username: ErnieTn
  github_repository: HLEOT/mva-hackathon-2026
  maximum_pitch_seconds: 180
