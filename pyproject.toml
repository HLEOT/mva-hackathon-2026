[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mva-track1"
version = "0.1.0"
description = "Codex-directed MVA Hackathon 2026 analysis with resumable local computation"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7", "psutil>=7,<8", "jsonschema>=4.25,<5", "requests>=2.32,<3",
                "huggingface_hub>=0.34,<0.35", "reportlab>=4.4,<5", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
